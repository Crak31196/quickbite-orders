<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>QuickBite</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0; font-family: 'Segoe UI', Arial, sans-serif;
    background: #F5F2EB; color: #12161C;
  }
  header {
    background: #12161C; color: #F5F2EB; padding: 20px 24px;
    display: flex; justify-content: space-between; align-items: center;
  }
  header h1 { margin: 0; font-size: 22px; }
  header h1 span { color: #C2410C; }
  #cart-count {
    background: #C2410C; color: white; border-radius: 999px;
    padding: 6px 14px; font-weight: 600; font-size: 14px;
  }
  main { max-width: 720px; margin: 0 auto; padding: 24px; }
  .card {
    background: white; border: 1px solid #D9D3C5; border-radius: 12px;
    padding: 18px 20px; margin-bottom: 14px;
    display: flex; justify-content: space-between; align-items: center;
  }
  .card h3 { margin: 0 0 4px; font-size: 18px; }
  .card p { margin: 0; color: #C2410C; font-weight: 600; }
  button {
    background: #12161C; color: white; border: none; border-radius: 8px;
    padding: 10px 16px; font-size: 14px; font-weight: 600; cursor: pointer;
  }
  button:hover { background: #C2410C; }
  #checkout-bar {
    position: sticky; bottom: 0; background: #12161C; color: white;
    padding: 16px 24px; display: flex; justify-content: space-between;
    align-items: center; border-radius: 12px; margin-top: 20px;
  }
  #checkout-bar button { background: #C2410C; padding: 12px 24px; }
  #status { margin-top: 16px; padding: 14px; border-radius: 8px; font-weight: 600; }
  #status.success { background: #DCFCE7; color: #166534; }
  #status.error { background: #FEE2E2; color: #991B1B; }
</style>
</head>
<body>

<header>
  <h1>Quick<span>Bite</span></h1>
  <div id="cart-count">Cart: 0</div>
</header>

<main>
  <div id="menu"></div>

  <div id="checkout-bar">
    <span id="cart-summary">No items yet</span>
    <button onclick="placeOrder()">Place Order</button>
  </div>

  <div id="status" style="display:none"></div>
</main>

<script>
let cart = {};

async function loadMenu() {
  try {
    const res = await fetch('/menu');
    if (!res.ok) throw new Error('Menu request failed: ' + res.status);
    const items = await res.json();
    const menuDiv = document.getElementById('menu');
    menuDiv.innerHTML = items.map(item => `
      <div class="card">
        <div>
          <h3>${item.name}</h3>
          <p>₹${item.price}</p>
        </div>
        <button onclick="addToCart(${item.id})">Add to Cart</button>
      </div>
    `).join('');
  } catch (err) {
    document.getElementById('menu').innerHTML =
      `<p style="color:#991B1B">Couldn't load menu: ${err.message}</p>`;
  }
}

function addToCart(itemId) {
  cart[itemId] = (cart[itemId] || 0) + 1;
  updateCartUI();
}

function updateCartUI() {
  const totalItems = Object.values(cart).reduce((a, b) => a + b, 0);
  document.getElementById('cart-count').textContent = `Cart: ${totalItems}`;
  document.getElementById('cart-summary').textContent =
    totalItems === 0 ? 'No items yet' : `${totalItems} item(s) in cart`;
}

async function placeOrder() {
  const itemIds = Object.keys(cart);

  if (itemIds.length === 0) {
    showStatus('Add something to your cart first.', 'error');
    return;
  }

  try {
    for (const itemId of itemIds) {
      const res = await fetch('/orders', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ item_id: Number(itemId), quantity: cart[itemId] })
      });
      if (!res.ok) throw new Error('Order failed for item ' + itemId);
    }
    showStatus('Order placed! Check /orders/1 to see it.', 'success');
    cart = {};
    updateCartUI();
  } catch (err) {
    showStatus('Something went wrong: ' + err.message, 'error');
  }
}

function showStatus(msg, type) {
  const statusDiv = document.getElementById('status');
  statusDiv.textContent = msg;
  statusDiv.className = type;
  statusDiv.style.display = 'block';
}

loadMenu();
</script>

</body>
</html>
